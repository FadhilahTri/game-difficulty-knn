<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Game Engagement Classifier</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #050510;
            color: #e0e0e0;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            background-image:
                radial-gradient(ellipse at 20% 50%, #0d0d3010 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, #00d4ff08 0%, transparent 50%);
        }
        /* Navbar */
        .navbar {
            background: rgba(10, 10, 30, 0.95) !important;
            border-bottom: 1px solid #00d4ff33;
            backdrop-filter: blur(10px);
            padding: 12px 0;
        }
        .navbar-brand {
            color: #00d4ff !important;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 2px;
        }
        .nav-link {
            color: #aaa !important;
            font-size: 1rem;
            letter-spacing: 1px;
            font-weight: 500;
            transition: color 0.3s;
        }
        .nav-link:hover { color: #00d4ff !important; }

        /* Cards */
        .card {
            background: rgba(20, 20, 45, 0.9);
            border: 1px solid #00d4ff22;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 40px #00d4ff11;
        }
        .card:hover { box-shadow: 0 0 60px #00d4ff22; transition: box-shadow 0.3s; }

        /* Form inputs */
        .form-control, .form-select {
            background: rgba(0, 5, 20, 0.8);
            border: 1px solid #00d4ff33;
            color: #e0e0e0;
            border-radius: 10px;
            padding: 10px 15px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
        }
        .form-control:focus, .form-select:focus {
            background: rgba(0, 5, 20, 0.9);
            border-color: #00d4ff;
            color: #fff;
            box-shadow: 0 0 0 3px #00d4ff22;
        }
        .form-select option { background: #0a0a1e; }
        .form-label {
            color: #00d4ff;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        /* Buttons */
        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #0055ff);
            border: none;
            border-radius: 12px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            letter-spacing: 2px;
            padding: 14px;
            font-size: 0.9rem;
            transition: all 0.3s;
            box-shadow: 0 0 20px #00d4ff44;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #0055ff, #00d4ff);
            transform: translateY(-2px);
            box-shadow: 0 0 30px #00d4ff66;
        }
        .btn-outline-secondary {
            border-color: #00d4ff44;
            color: #00d4ff;
            border-radius: 12px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
        }
        .btn-outline-secondary:hover {
            background: #00d4ff22;
            border-color: #00d4ff;
            color: #00d4ff;
        }

        /* Section title */
        .section-title {
            color: #00d4ff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            border-bottom: 1px solid #00d4ff22;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        /* Hero */
        .hero-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 2.2rem;
            background: linear-gradient(135deg, #00d4ff, #ffffff, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 3px;
        }
        .hero-subtitle { color: #8888aa; font-size: 1.1rem; letter-spacing: 1px; }

        /* Stats badge */
        .stat-badge {
            background: rgba(0, 212, 255, 0.08);
            border: 1px solid #00d4ff33;
            border-radius: 12px;
            padding: 12px 20px;
            text-align: center;
        }
        .stat-badge .num {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            color: #00d4ff;
            font-weight: 700;
        }
        .stat-badge .lbl { font-size: 0.8rem; color: #888; letter-spacing: 1px; }

        /* Glow line */
        .glow-line {
            height: 2px;
            background: linear-gradient(90deg, transparent, #00d4ff, transparent);
            margin: 20px 0;
        }

        /* Footer */
        footer {
            background: rgba(10, 10, 30, 0.8);
            border-top: 1px solid #00d4ff22;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 1px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #050510; }
        ::-webkit-scrollbar-thumb { background: #00d4ff44; border-radius: 3px; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
        <a class="navbar-brand" href="/">⚡ GAMEIQ</a>
        <div class="navbar-nav ms-auto gap-3">
            <a class="nav-link" href="/">HOME</a>
            <a class="nav-link" href="/about">ABOUT</a>
        </div>
    </div>
</nav>

{% block content %}{% endblock %}

<footer class="text-center py-3 mt-5">
    <small class="text-muted">© 2025 GameIQ — Klasifikasi Engagement Pemain Game dengan KNN &nbsp;|&nbsp; Fadhil</small>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
